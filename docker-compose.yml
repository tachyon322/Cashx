services:
  db:
    image: postgres:17-alpine
    container_name: cashx-db
    environment:
      POSTGRES_USER: cashx
      POSTGRES_PASSWORD: cashx_dev_password
      POSTGRES_DB: cashx
    ports:
      - "5436:5432"
    volumes:
      - cashx_pgdata:/var/lib/postgresql/data
      - ./backend/deploy/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cashx -d cashx"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: cashx-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6381:6379"
    volumes:
      - cashx_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio
    container_name: cashx-minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: cashx_minio
      MINIO_ROOT_PASSWORD: cashx_minio_dev_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - cashx_miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  cashx_pgdata:
  cashx_redisdata:
  cashx_miniodata:
