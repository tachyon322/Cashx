services:
  db:
    image: postgres:17-alpine
    container_name: cashx-db
    environment:
      POSTGRES_USER: cashx
      POSTGRES_PASSWORD: cashx_dev_password
      POSTGRES_DB: cashx
    ports:
      - "5436:5432"
    volumes:
      - cashx_pgdata:/var/lib/postgresql/data
      - ./backend/deploy/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cashx -d cashx"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: cashx-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6381:6379"
    volumes:
      - cashx_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    container_name: cashx-api
    command: cashx-api
    working_dir: /app
    env_file: ./backend/.env
    environment:
      CASHX_DATABASE_URL: postgres://cashx_app:cashx_app_dev_password@db:5432/cashx?sslmode=disable
      CASHX_ADMIN_DATABASE_URL: postgres://cashx:cashx_dev_password@db:5432/cashx?sslmode=disable
      CASHX_REDIS_ADDR: redis:6379
    ports:
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  redirect:
    build: ./backend
    container_name: cashx-redirect
    command: cashx-redirect
    working_dir: /app
    env_file: ./backend/.env
    environment:
      CASHX_DATABASE_URL: postgres://cashx_app:cashx_app_dev_password@db:5432/cashx?sslmode=disable
      CASHX_ADMIN_DATABASE_URL: postgres://cashx:cashx_dev_password@db:5432/cashx?sslmode=disable
      CASHX_REDIS_ADDR: redis:6379
    ports:
      - "8081:8081"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: ./backend
    container_name: cashx-worker
    command: cashx-worker
    working_dir: /app
    env_file: ./backend/.env
    environment:
      CASHX_DATABASE_URL: postgres://cashx_app:cashx_app_dev_password@db:5432/cashx?sslmode=disable
      CASHX_ADMIN_DATABASE_URL: postgres://cashx:cashx_dev_password@db:5432/cashx?sslmode=disable
      CASHX_REDIS_ADDR: redis:6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  cashx_pgdata:
  cashx_redisdata:
