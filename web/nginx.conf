server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # проксировать API/редиректы не нужно — Caddy уже делает handle /api/* и /c/* до этого контейнера не дойдут
    # если web запущен отдельно без Caddy — можно раскомментировать:
    # location /api/ { proxy_pass http://api:8080; }
    # location /c/ { proxy_pass http://redirect:8081; }
}
