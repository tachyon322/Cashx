        partner_id:
          type: string
        amount_kopecks:
          type: integer
          format: int64
        method:
          type: string
          enum: [usdt, sbp]
        requisites:
          type: string
        bank:
          type: string
          nullable: true
        fee_kopecks:
          type: integer
          format: int64
        usdt_amount:
          type: number
          nullable: true
        rate:
          type: number
          nullable: true
        status:
          type: string
          enum: [pending, approved, paid, rejected, cancelled]
        comment:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    LedgerEntry:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
        amount_kopecks:
          type: integer
          format: int64
        balance_after_kopecks:
          type: integer
          format: int64
        created_at:
          type: string
          format: date-time
    PayoutRules:
      type: object
