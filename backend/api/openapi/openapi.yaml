openapi: 3.1.0
info:
  title: CashX API
  version: 1.0.0
  description: Partner platform API. All money in kopecks (int64), rates in basis points.
servers:
  - url: /api/v1
paths:
  /auth/register:
    post:
      operationId: authRegister
      summary: Register a partner account (pending approval)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/UserMe'
        '400':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /auth/me:
    get:
      operationId: authMe
      summary: Current user
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/UserMe'
        '401':
          $ref: '#/components/responses/Error'
  /auth/password-reset/request:
    post:
      operationId: authPasswordResetRequest
      summary: Request password reset (always 202; token returned in dev)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email:
                  type: string
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  reset_token:
                    type: string
                    nullable: true
  /auth/password-reset/confirm:
    post:
      operationId: authPasswordResetConfirm
      summary: Confirm password reset
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, new_password]
              properties:
                token:
                  type: string
                new_password:
                  type: string
      responses:
        '204':
          description: No content
        '400':
          $ref: '#/components/responses/Error'
  /cabinet/summary:
    get:
      operationId: cabinetSummary
      summary: Partner dashboard summary
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SummaryResponse'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
  /cabinet/offers:
    get:
      operationId: cabinetOffersList
      summary: Offer catalog with partner access state
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/CabinetOffer'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
  /cabinet/offers/{offerId}/join:
    post:
      operationId: cabinetOfferJoin
      summary: Join an active offer, creating a tracking link
      parameters:
        - $ref: '#/components/parameters/OfferId'
      responses:
        '201':
          description: Joined
          content:
            application/json:
              schema:
                type: object
                properties:
                  offer_id:
                    type: string
                  rate_bps:
                    type: integer
                  tracking_url:
                    type: string
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /cabinet/offers/{offerId}:
    get:
      operationId: cabinetOfferStats
      summary: Offer statistics (joined offers only)
      parameters:
        - $ref: '#/components/parameters/OfferId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfferStatsResponse'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /cabinet/sources:
    get:
      operationId: cabinetSourcesList
      summary: List all traffic sources of the partner across offers
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Source'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
  /cabinet/offers/{offerId}/sources:
    get:
      operationId: cabinetOfferSourcesList
      summary: List traffic sources for a joined offer
      parameters:
        - $ref: '#/components/parameters/OfferId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Source'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
    post:
      operationId: cabinetOfferSourceCreate
      summary: Create a traffic source for a joined offer
      parameters:
        - $ref: '#/components/parameters/OfferId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SourceInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Source'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /cabinet/offers/{offerId}/sources/{sourceId}:
    patch:
      operationId: cabinetOfferSourceUpdate
      summary: Update a traffic source
      parameters:
        - $ref: '#/components/parameters/OfferId'
        - $ref: '#/components/parameters/SourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SourceUpdate'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Source'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
    delete:
      operationId: cabinetOfferSourceDelete
      summary: Delete a traffic source (only if it has no clicks)
      parameters:
        - $ref: '#/components/parameters/OfferId'
        - $ref: '#/components/parameters/SourceId'
      responses:
        '204':
          description: No content
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /cabinet/source-groups:
    get:
      operationId: cabinetSourceGroupsList
      summary: List partner's source groups
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/SourceGroup'
        '401':
          $ref: '#/components/responses/Error'
    post:
      operationId: cabinetSourceGroupCreate
      summary: Create a source group
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SourceGroupInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceGroup'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /cabinet/source-groups/{groupId}:
    patch:
      operationId: cabinetSourceGroupUpdate
      summary: Update a source group
      parameters:
        - $ref: '#/components/parameters/GroupId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SourceGroupInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceGroup'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
    delete:
      operationId: cabinetSourceGroupDelete
      summary: Delete an empty source group
      parameters:
        - $ref: '#/components/parameters/GroupId'
      responses:
        '204':
          description: No content
        '401':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /cabinet/payouts/config:
    get:
      operationId: cabinetPayoutsConfig
      summary: Payout configuration
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PayoutRules'
        '401':
          $ref: '#/components/responses/Error'
  /cabinet/payouts:
    get:
      operationId: cabinetPayoutsList
      summary: Balance, withdrawal requests and ledger history
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  balance:
                    $ref: '#/components/schemas/Balance'
                  requests:
                    type: array
                    items:
                      $ref: '#/components/schemas/WithdrawalRequest'
                  history:
                    type: array
                    items:
                      $ref: '#/components/schemas/LedgerEntry'
        '401':
          $ref: '#/components/responses/Error'
  /cabinet/payouts/requests:
    post:
      operationId: cabinetPayoutRequest
      summary: Request a withdrawal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [method, amount_kopecks, requisites]
              properties:
                method:
                  type: string
                  enum: [usdt, sbp]
                amount_kopecks:
                  type: integer
                  format: int64
                requisites:
                  type: string
                bank:
                  type: string
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WithdrawalRequest'
        '400':
          $ref: '#/components/responses/Error'
        '402':
          $ref: '#/components/responses/Error'
  /cabinet/payouts/requests/{id}/cancel:
    post:
      operationId: cabinetPayoutCancel
      summary: Cancel own pending withdrawal request
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WithdrawalRequest'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /cabinet/referrals:
    get:
      operationId: cabinetReferrals
      summary: Referral program info
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReferralsResponse'
        '401':
          $ref: '#/components/responses/Error'
  /cabinet/notifications:
    get:
      operationId: cabinetNotificationsList
      summary: Notifications with unread counter
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  unread_count:
                    type: integer
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/NotificationItem'
        '401':
          $ref: '#/components/responses/Error'
  /cabinet/notifications/read-all:
    post:
      operationId: cabinetNotificationsReadAll
      summary: Mark all notifications read
      responses:
        '204':
          description: No content
        '401':
          $ref: '#/components/responses/Error'
  /cabinet/notifications/{type}/{id}/read:
    post:
      operationId: cabinetNotificationRead
      summary: Mark a single notification read
      parameters:
        - name: type
          in: path
          required: true
          schema:
            type: string
            enum: [announcement, personal]
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: No content
        '401':
          $ref: '#/components/responses/Error'
  /cabinet/profile:
    put:
      operationId: cabinetProfileUpdate
      summary: Update own profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                telegram_user_id:
                  type: integer
                  format: int64
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/UserMe'
        '401':
          $ref: '#/components/responses/Error'

  /admin/partners:
    get:
      operationId: adminPartnersList
      summary: List partners
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, active, blocked]
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/AdminPartner'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
    post:
      operationId: adminPartnerCreate
      summary: Create a partner (active immediately)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, email, password]
              properties:
                name:
                  type: string
                email:
                  type: string
                password:
                  type: string
                commission_bps:
                  type: integer
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                  name:
                    type: string
                  email:
                    type: string
        '400':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /admin/partners/{id}:
    get:
      operationId: adminPartnerGet
      summary: Partner detail with balance, ledger, withdrawals, accesses
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminPartnerDetail'
        '404':
          $ref: '#/components/responses/Error'
    patch:
      operationId: adminPartnerUpdate
      summary: Update partner (approve/block/rename/revshare)
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                email:
                  type: string
                password:
                  type: string
                is_approved:
                  type: boolean
                is_blocked:
                  type: boolean
                revshare_percent_bps:
                  type: integer
                  description: RevShare for the partner (1% = 100 bps). Updates global revshare and syncs all accesses.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminPartner'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /admin/partners/{id}/rate:
    post:
      operationId: adminPartnerRate
      summary: Set partner's personal rate for an offer
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [offer_id, rate_bps]
              properties:
                offer_id:
                  type: string
                rate_bps:
                  type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  offer_id:
                    type: string
                  rate_bps:
                    type: integer
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /admin/projects:
    get:
      operationId: adminProjectsList
      summary: List projects
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProjectCard'
    post:
      operationId: adminProjectCreate
      summary: Create project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [slug, name, destination_url]
              properties:
                slug:
                  type: string
                name:
                  type: string
                description:
                  type: string
                destination_url:
                  type: string
                is_active:
                  type: boolean
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectCard'
        '400':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /admin/projects/{id}:
    patch:
      operationId: adminProjectUpdate
      summary: Update project
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
                destination_url:
                  type: string
                is_active:
                  type: boolean
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectCard'
        '404':
          $ref: '#/components/responses/Error'
  /admin/offers:
    get:
      operationId: adminOffersList
      summary: List offers
      parameters:
        - name: project_id
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/OfferCard'
    post:
      operationId: adminOfferCreate
      summary: Create offer (creates terms v1)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project_id, name]
              properties:
                project_id:
                  type: string
                name:
                  type: string
                category:
                  type: string
                description:
                  type: string
                destination_url:
                  type: string
                status:
                  type: string
                  enum: [active, available, pending, coming_soon]
                  default: pending
                rate_bps:
                  type: integer
                  description: Deprecated — revshare is now per-partner, not per-offer. If omitted, defaults to 0.
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfferCard'
        '400':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /admin/offers/{id}:
    patch:
      operationId: adminOfferUpdate
      summary: Update offer card
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                category:
                  type: string
                description:
                  type: string
                destination_url:
                  type: string
                status:
                  type: string
                  enum: [active, available, pending, coming_soon]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfferCard'
        '400':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
  /admin/offers/{id}/terms:
    post:
      operationId: adminOfferTerms
      summary: Add new offer terms version (rate change)
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rate_bps]
              properties:
                rate_bps:
                  type: integer
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  version:
                    type: integer
                  rate_bps:
                    type: integer
                  effective_from:
                    type: string
                    format: date-time
        '404':
          $ref: '#/components/responses/Error'
  /admin/integration-keys:
    get:
      operationId: adminIntegrationKeysList
      summary: List integration keys (no secrets)
      parameters:
        - name: project_id
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/IntegrationKey'
    post:
      operationId: adminIntegrationKeyCreate
      summary: Create integration key (secret shown once)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [project_id]
              properties:
                project_id:
                  type: string
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationKeySecret'
        '404':
          $ref: '#/components/responses/Error'
  /admin/integration-keys/{keyId}/rotate:
    post:
      operationId: adminIntegrationKeyRotate
      summary: Rotate integration key (secret shown once)
      parameters:
        - name: keyId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationKeySecret'
        '404':
          $ref: '#/components/responses/Error'
  /admin/integration-keys/{keyId}/deactivate:
    post:
      operationId: adminIntegrationKeyDeactivate
      summary: Deactivate integration key
      parameters:
        - name: keyId
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: No content
        '404':
          $ref: '#/components/responses/Error'
  /admin/withdrawals:
    get:
      operationId: adminWithdrawalsList
      summary: List withdrawal requests
      parameters:
        - name: status
          in: query
          schema:
            type: string
        - name: partner_id
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          description: OK
          content:
