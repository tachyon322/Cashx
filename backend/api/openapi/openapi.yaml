          type: string
        name:
          type: string
        description:
          type: string
          nullable: true
        destination_url:
          type: string
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
    OfferCard:
      type: object
      properties:
        id:
          type: string
        project_id:
          type: string
        project_name:
          type: string
        name:
          type: string
        category:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        destination_url:
          type: string
          nullable: true
        status:
          type: string
        current_rate_bps:
          type: integer
        version:
          type: integer
        created_at:
          type: string
          format: date-time
    IntegrationKey:
      type: object
      properties:
        key_id:
          type: string
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        last_used_at:
          type: string
          format: date-time
          nullable: true
        secret_hint:
          type: string
    IntegrationKeySecret:
      type: object
      properties:
        key_id:
          type: string
        secret:
          type: string
    AdminWithdrawal:
      allOf:
        - $ref: '#/components/schemas/WithdrawalRequest'
        - type: object
          properties:
            partner_name:
              type: string
            partner_email:
              type: string
    AdminLedgerEntry:
      allOf:
        - $ref: '#/components/schemas/LedgerEntry'
        - type: object
          properties:
            partner_id:
              type: string
            partner_name:
              type: string
            comment:
              type: string
              nullable: true
    AdminEarning:
      type: object
