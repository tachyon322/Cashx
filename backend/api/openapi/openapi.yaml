        min_withdraw_kopecks:
          type: integer
          format: int64
        usdt_rate:
          type: number
        sbp_fee_flat_kopecks:
          type: integer
          format: int64
        sbp_fee_percent_bps:
          type: integer
        updated_at:
          type: string
          format: date-time
    ReferralItem:
      type: object
