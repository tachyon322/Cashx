        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'

components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
    OfferId:
      name: offerId
      in: path
      required: true
      schema:
        type: string
    SourceId:
      name: sourceId
      in: path
      required: true
      schema:
        type: string
    GroupId:
      name: groupId
      in: path
      required: true
      schema:
        type: string
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      required: [message]
      properties:
        message:
          type: string
    RegisterRequest:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
        email:
          type: string
        password:
          type: string
        referral_code:
          type: string
    UserMe:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        name:
          type: string
        role:
          type: string
          enum: [partner, staff]
        is_approved:
          type: boolean
        is_blocked:
          type: boolean
        partner:
          type: object
          nullable: true
          properties:
            referral_code:
              type: string
            telegram_user_id:
              type: integer
              format: int64
              nullable: true
        staff:
          type: object
          nullable: true
          properties:
            roles:
              type: array
              items:
                type: string
    Balance:
      type: object
      properties:
        available_kopecks:
          type: integer
          format: int64
        reserved_kopecks:
          type: integer
          format: int64
    DayStats:
      type: object
      properties:
        date:
          type: string
        clicks:
          type: integer
        unique_clicks:
          type: integer
        registrations:
          type: integer
        first_payments:
          type: integer
        income_kopecks:
          type: integer
          format: int64
    SummaryResponse:
      type: object
      properties:
        balance:
          $ref: '#/components/schemas/Balance'
        income:
          type: object
          properties:
            today_kopecks:
              type: integer
              format: int64
            week_kopecks:
              type: integer
              format: int64
            month_kopecks:
              type: integer
              format: int64
            all_kopecks:
              type: integer
              format: int64
        funnel:
          type: object
          properties:
            clicks:
              type: integer
            unique_clicks:
              type: integer
            registrations:
              type: integer
            first_payments:
              type: integer
            income_kopecks:
              type: integer
              format: int64
        chart:
          type: array
          items:
            $ref: '#/components/schemas/DayStats'
        active_offers:
          type: array
          items:
            type: object
            properties:
              offer_id:
                type: string
              name:
                type: string
              rate_bps:
                type: integer
              tracking_url:
                type: string
              clicks:
                type: integer
              registrations:
                type: integer
              income_kopecks:
                type: integer
                format: int64
        revshare_percent_bps:
          type: integer
        telegram:
          type: object
          properties:
            connected:
              type: boolean
    CabinetOffer:
      type: object
      properties:
        offer_id:
          type: string
        project_id:
          type: string
        project_name:
          type: string
        project_logo_url:
          type: string
          nullable: true
        name:
          type: string
        category:
          type: string
          nullable: true
        description:
          type: string
          nullable: true
        status:
          type: string
          enum: [active, available, pending, coming_soon]
        my_rate_bps:
          type: integer
          nullable: true
        epc:
          type: number
          nullable: true
        cr:
          type: number
          nullable: true
        my_tracking_url:
          type: string
          nullable: true
    OfferAgg:
      type: object
      properties:
        income_kopecks:
          type: integer
          format: int64
        clicks:
          type: integer
        unique_clicks:
          type: integer
        registrations:
          type: integer
        first_payments:
          type: integer
    HistoryItem:
      type: object
      properties:
        id:
          type: string
        kind:
          type: string
          enum: [click, registration, payment, earning, reversal]
        amount_kopecks:
          type: integer
          format: int64
          nullable: true
        occurred_at:
          type: string
          format: date-time
    OfferStatsResponse:
      type: object
      properties:
        offer:
          $ref: '#/components/schemas/OfferCard'
        tracking_url:
          type: string
        summary:
          type: object
          properties:
            today:
              $ref: '#/components/schemas/OfferAgg'
            week:
              $ref: '#/components/schemas/OfferAgg'
            month:
              $ref: '#/components/schemas/OfferAgg'
            all:
              $ref: '#/components/schemas/OfferAgg'
        chart:
          type: array
          items:
            $ref: '#/components/schemas/DayStats'
        history:
          type: array
          items:
            $ref: '#/components/schemas/HistoryItem'
    SourceTotals:
      type: object
      properties:
        clicks:
          type: integer
          format: int64
        unique_clicks:
          type: integer
          format: int64
        registrations:
          type: integer
          format: int64
        first_payments:
          type: integer
          format: int64
        income_kopecks:
          type: integer
          format: int64
    Source:
      type: object
      properties:
        id:
          type: string
        code:
          type: string
        name:
          type: string
        offer_id:
          type: string
          nullable: true
          description: Offer the source belongs to (set by GET /cabinet/sources)
        comment:
          type: string
          nullable: true
        group_id:
          type: string
          nullable: true
        group_name:
          type: string
          nullable: true
        is_default:
          type: boolean
        is_active:
          type: boolean
        url:
          type: string
        type:
          type: string
          enum: [link, promo]
          nullable: true
        registration_bonus:
          type: integer
          nullable: true
        domain:
          type: string
          nullable: true
        redirect_id:
          type: string
          nullable: true
        totals:
          $ref: '#/components/schemas/SourceTotals'
        totals_30d:
          $ref: '#/components/schemas/SourceTotals'
        created_at:
          type: string
          format: date-time
    SourceInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
        code:
          type: string
          nullable: true
        comment:
          type: string
          nullable: true
        group_id:
          type: string
          nullable: true
        is_default:
          type: boolean
        type:
          type: string
          enum: [link, promo]
          nullable: true
        registration_bonus:
          type: integer
          nullable: true
        domain:
          type: string
          nullable: true
        redirect_id:
          type: string
          nullable: true
    SourceUpdate:
      type: object
      required: [name]
      properties:
        name:
          type: string
        code:
          type: string
          nullable: true
        comment:
          type: string
          nullable: true
        group_id:
          type: string
          nullable: true
        is_active:
          type: boolean
        is_default:
          type: boolean
        type:
          type: string
          enum: [link, promo]
          nullable: true
        registration_bonus:
          type: integer
          nullable: true
        domain:
          type: string
          nullable: true
        redirect_id:
          type: string
          nullable: true
    SourceGroup:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        comment:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    SourceGroupInput:
      type: object
      required: [name]
