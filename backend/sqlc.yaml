version: "2"
sql:
  - engine: "postgresql"
    schema: "internal/repository/schema"
    queries: "internal/repository/queries"
    gen:
      go:
        package: "repository"
        out: "internal/repository"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_interface: true
        overrides:
          - db_type: "uuid"
            go_type: "string"
          - db_type: "inet"
            go_type: "string"
          - db_type: "numeric"
            go_type: "float64"
